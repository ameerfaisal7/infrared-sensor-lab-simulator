<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrared Sensor Lab Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a}canvas{display:block;width:100%;height:100%}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 18px rgba(15,23,42,.06)}input[type=range]{accent-color:#ef4444}</style>
</head>
<body>
<header class="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-slate-200"><div class="max-w-7xl mx-auto p-4 flex flex-col lg:flex-row gap-4 justify-between items-center"><div><h1 class="text-xl font-bold">Infrared Sensor Lab Simulator</h1><p class="text-sm text-slate-500">Interactive physics and hardware workbench</p></div><div class="flex flex-wrap gap-2"><button class="mode px-3 py-2 rounded-lg bg-red-600 text-white" data-mode="pir">PIR Motion</button><button class="mode px-3 py-2 rounded-lg bg-slate-100" data-mode="active">Reflective IR</button><button class="mode px-3 py-2 rounded-lg bg-slate-100" data-mode="thermal">Thermal Array</button><button class="mode px-3 py-2 rounded-lg bg-slate-100" data-mode="remote">38 kHz Receiver</button></div></div></header>
<main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-12 gap-5"><section class="lg:col-span-7 space-y-5"><div class="card p-4"><div class="flex justify-between items-center mb-3"><h2 id="title" class="font-semibold">PIR Fresnel Motion Chamber</h2><span id="band" class="text-xs text-red-600 bg-red-50 px-2 py-1 rounded">9.4 µm</span></div><div class="aspect-video rounded-xl overflow-hidden bg-slate-950"><canvas id="scene"></canvas></div><p id="hint" class="text-xs text-slate-500 mt-3">Drag the heat source across the sensing zones.</p></div><div class="card p-4"><div class="flex justify-between mb-3"><h2 class="font-semibold">Signal Oscilloscope</h2><div class="text-sm">Vout: <span id="voltage">0.00 V</span> · <span id="digital">LOW</span></div></div><div class="h-36 rounded-xl overflow-hidden bg-slate-950"><canvas id="scope"></canvas></div></div></section><aside class="lg:col-span-5 space-y-5"><div class="card p-5"><div class="flex justify-between items-center mb-4"><h2 class="font-semibold">Sensor Controls</h2><button id="reset" class="text-sm text-red-600">Reset</button></div><div id="controls" class="space-y-4"></div></div><div class="card p-5"><div class="flex gap-4 border-b pb-2 mb-4"><button class="tab text-red-600">Hardware</button><button class="tab text-slate-500">Arduino Code</button><button class="tab text-slate-500">Theory</button></div><div id="panel"></div></div><div class="card p-5 grid grid-cols-2 gap-3"><div><p class="text-xs text-slate-500">IR Metric</p><p id="metric1" class="font-mono font-bold text-red-600">12.4 W/m²</p></div><div><p class="text-xs text-slate-500">SNR / Ratio</p><p id="metric2" class="font-mono font-bold text-cyan-600">84.2%</p></div></div></aside></main>
<script>
const defaults={pir:{sensitivity:70,temp:37},active:{distance:25,reflectivity:85,current:20},thermal:{temp:42,palette:'ironbow'},remote:{frequency:38}};const state={mode:'pir',...JSON.parse(JSON.stringify(defaults)),drag:false,x:0,y:0,v:0,high:false,buffer:Array(100).fill(0)};const scene=document.querySelector('#scene'),ctx=scene.getContext('2d'),scope=document.querySelector('#scope'),sctx=scope.getContext('2d'),$=s=>document.querySelector(s);function resize(){let r=scene.parentElement.getBoundingClientRect();scene.width=r.width;scene.height=r.height;r=scope.parentElement.getBoundingClientRect();scope.width=r.width;scope.height=r.height}window.addEventListener('resize',resize);resize();function control(label,key,min,max,unit,obj){return `<label class="block"><span class="flex justify-between text-sm"><span>${label}</span><b id="v-${key}">${obj[key]}${unit}</b></span><input class="w-full" type="range" min="${min}" max="${max}" value="${obj[key]}" data-key="${key}"></label>`}function renderControls(){let c='';if(state.mode==='pir')c=control('Sensitivity','sensitivity',10,100,'%',state.pir)+control('Target temperature','temp',20,60,' °C',state.pir);if(state.mode==='active')c=control('Distance','distance',2,60,' cm',state.active)+control('Reflectivity','reflectivity',5,95,'%',state.active)+control('LED current','current',5,50,' mA',state.active);if(state.mode==='thermal')c=control('Hotspot temperature','temp',25,80,' °C',state.thermal)+`<label class="block text-sm">Palette<select id="palette" class="mt-1 w-full p-2 border rounded-lg"><option>ironbow</option><option>rainbow</option><option>mono</option></select></label>`;if(state.mode==='remote')c=control('Carrier frequency','frequency',30,56,' kHz',state.remote)+`<button id="send" class="w-full py-2 rounded-lg bg-red-600 text-white font-semibold">Transmit IR Code</button>`;$('#controls').innerHTML=c;document.querySelectorAll('input[type=range]').forEach(i=>i.oninput=()=>{let k=i.dataset.key;state[state.mode][k]=+i.value;$('#v-'+k).textContent=i.value+(k==='temp'?' °C':k==='distance'?' cm':k==='current'?' mA':'%')});if($('#palette'))$('#palette').onchange=e=>state.thermal.palette=e.target.value;if($('#send'))$('#send').onclick=()=>state.remote.pulse=performance.now()}function setMode(m){state.mode=m;document.querySelectorAll('.mode').forEach(b=>b.className='mode px-3 py-2 rounded-lg bg-slate-100');document.querySelector(`[data-mode=${m}]`).className='mode px-3 py-2 rounded-lg bg-red-600 text-white';renderControls();renderPanel()}function renderPanel(){let p=state.mode==='pir'?['PIR module','Dual pyroelectric elements behind a Fresnel lens. Motion produces a differential signal.','digitalRead(PIR_PIN)']:state.mode==='active'?['Reflective IR','A 940 nm emitter and photodiode estimate reflected intensity.','analogRead(A0)']:state.mode==='thermal'?['Thermal array','A thermopile array measures far-infrared radiance pixel by pixel.','readThermalPixels()']:['38 kHz receiver','A demodulating receiver detects modulated IR bursts.','IrReceiver.decode()'];$('#panel').innerHTML=`<h3 class="font-semibold mb-2">${p[0]}</h3><p class="text-sm text-slate-600 mb-3">${p[1]}</p><pre class="bg-slate-900 text-cyan-300 p-3 rounded-lg text-xs overflow-auto">// Arduino reading\nvoid loop(){\n  ${p[2]};\n}</pre>`}function dot(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function draw(){let w=scene.width,h=scene.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#e2e8f0';for(let x=0;x<w;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(!state.drag){state.x=w*.5+Math.sin(performance.now()/700)*w*.25;state.y=h*.5+Math.cos(performance.now()/900)*35}if(state.mode==='pir')pir(w,h);if(state.mode==='active')active(w,h);if(state.mode==='thermal')thermal(w,h);if(state.mode==='remote')remote(w,h);scopeDraw();requestAnimationFrame(draw)}function pir(w,h){let sx=w*.84,sy=h/2;ctx.fillStyle='#cbd5e1';ctx.fillRect(sx-10,sy-45,30,90);ctx.strokeStyle='#ef4444';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-w*.65,sy+(i-2)*45);ctx.stroke()}dot(state.x,state.y,18,'#f87171');state.v=Math.max(-2.5,Math.min(2.5,Math.sin((state.x-sx)/35)*state.pir.sensitivity/35));state.high=Math.abs(state.v)>1;$('#metric1').textContent=(11.5*Math.pow((state.pir.temp+273.15)/300,4)).toFixed(1)+' W/m²';$('#metric2').textContent=Math.max(10,95-Math.hypot(state.x-sx,state.y-sy)/5).toFixed(1)+'%'}function active(w,h){let sx=w*.15,sy=h/2,tx=sx+40+state.active.distance*w/70;dot(sx,sy-25,14,'#c084fc');dot(sx,sy+25,14,'#1e1b4b');ctx.strokeStyle='#d946ef';ctx.beginPath();ctx.moveTo(sx+15,sy-25);ctx.lineTo(tx,sy);ctx.stroke();ctx.fillStyle='#64748b';ctx.fillRect(tx,sy-55,25,110);state.v=Math.min(5,(state.active.reflectivity/100)*(state.active.current/20)*Math.pow(15/state.active.distance,2)*2.8);state.high=state.v>1.8;$('#metric1').textContent=(state.v*3.1).toFixed(1)+' mW/cm²';$('#metric2').textContent=Math.min(99.9,state.v*20).toFixed(1)+'%'}function thermal(w,h){let n=12,size=Math.min(w,h)*.65/n,x0=(w-size*n)/2,y0=(h-size*n)/2;for(let r=0;r<n;r++)for(let c=0;c<n;c++){let d=Math.hypot(x0+c*size+size/2-state.x,y0+r*size+size/2-state.y),t=20+(state.thermal.temp-20)*Math.exp(-d/55);ctx.fillStyle=color(t);ctx.fillRect(x0+c*size,y0+r*size,size-1,size-1)}state.v=state.thermal.temp/80*4.5;state.high=state.thermal.temp>35;$('#metric1').textContent=(state.thermal.temp*.42).toFixed(1)+' W/m²';$('#metric2').textContent='96.5%'}function color(t){let n=Math.max(0,Math.min(1,(t-18)/45));if(state.thermal.palette==='mono'){let v=Math.floor(n*255);return`rgb(${v},${v},${v})`}if(state.thermal.palette==='rainbow')return`hsl(${(1-n)*240},100%,50%)`;return`rgb(${Math.floor(255*Math.min(1,n*1.5))},${Math.floor(255*Math.max(0,Math.min(1,(n-.35)*1.6)))},${Math.floor(255*Math.max(0,Math.min(1,(.5-n)*2)))})`}function remote(w,h){let y=h/2;ctx.fillStyle='#cbd5e1';ctx.fillRect(w*.15,y-50,45,100);ctx.fillStyle='#0f172a';ctx.fillRect(w*.75,y-45,55,90);let pulse=state.remote.pulse&&performance.now()-state.remote.pulse<800;if(pulse){ctx.strokeStyle='#ef4444';for(let x=w*.25;x<w*.75;x+=35){ctx.beginPath();ctx.arc(x,y,20,-.5,.5);ctx.stroke()}state.v=Math.sin(performance.now()/20)>0?5:0;state.high=state.v>2.5}else{state.v=0;state.high=false}$('#metric1').textContent=pulse?'38 kHz':'0 kHz';$('#metric2').textContent=pulse?'100%':'—'}function scopeDraw(){state.buffer.push(state.v);state.buffer.shift();let w=scope.width,h=scope.height;sctx.clearRect(0,0,w,h);sctx.strokeStyle='#334155';for(let y=0;y<h;y+=h/4){sctx.beginPath();sctx.moveTo(0,y);sctx.lineTo(w,y);sctx.stroke()}sctx.strokeStyle='#38bdf8';sctx.beginPath();state.buffer.forEach((v,i)=>{let x=i*w/(state.buffer.length-1),y=h-(v+2.5)/7.5*h;i?sctx.lineTo(x,y):sctx.moveTo(x,y)});sctx.stroke();$('#voltage').textContent=state.v.toFixed(2)+' V';$('#digital').textContent=state.high?'HIGH':'LOW'}scene.addEventListener('pointerdown',e=>{state.drag=true;scene.setPointerCapture(e.pointerId)});scene.addEventListener('pointermove',e=>{if(state.drag){let r=scene.getBoundingClientRect();state.x=e.clientX-r.left;state.y=e.clientY-r.top}});scene.addEventListener('pointerup',()=>state.drag=false);document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#reset').onclick=()=>{Object.assign(state,JSON.parse(JSON.stringify({mode:state.mode,...defaults[state.mode]})));renderControls()};setMode('pir');draw();
</script>
</body>
</html>
